services:
  szuru-dan:
    build: .
    container_name: szuru-dan
    ports:
      - "${PORT:-9000}:${PORT:-9000}"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      # Only check that the port is reachable: avoids depending on backend auth (anonymous requests get 403) and keeps the request log clean
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', ${PORT:-9000}), 3).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host  # Lets the container reach szurubooru on the host directly; if not needed, remove this line and uncomment the networks section below

# If szurubooru also runs in Docker, remove network_mode: host and use the following instead:
# networks:
#   default:
#     name: szuru-network
